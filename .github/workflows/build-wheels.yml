name: Build Wheels

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build-wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.11']

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install build dependencies
      run: |
        # Install system dependencies for Linux (needed for library build)
        if [ "$RUNNER_OS" = "Linux" ]; then
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxfixes-dev libxft-dev libxext-dev libxrender-dev libxinerama-dev libxcursor-dev libxau-dev libpng-dev libfontconfig1-dev libfreetype6-dev build-essential
        fi
        pip install wheel setuptools build
    
    - name: Build core libraries
      run: |
        echo "Building core libraries first..."
        echo "Current directory: $(pwd)"
        echo "Checking if required library directories exist..."
        ls -la source/openssl-lib/linux-amd64/ || echo "OpenSSL libs not found"
        ls -la source/fl-lib/linux-amd64/ || echo "FL libs not found"
        ls -la source/blst-lib/linux-amd64/ || echo "BLST libs not found"
        ls -la source/pcre2-lib/linux-amd64/ || echo "PCRE2 libs not found"
        echo "Running build.py --lib-only..."
        python build.py --lib-only
        echo "Build.py exit code: $?"
        if [ $? -ne 0 ]; then
          echo "ERROR: build.py failed with exit code $?"
          exit 1
        fi
        echo "Library build completed. Checking for library files..."
        ls -la source/grapa-lib/linux-amd64/ || echo "No library files found"
        echo "Checking if build.py created any files in current directory..."
        ls -la *.o *.a *.so 2>/dev/null || echo "No build artifacts found in current directory"
    
    - name: Build wheels
      run: |
        echo "Current directory: $(pwd)"
        echo "Python version: $(python --version)"
        echo "Checking if libraries exist before wheel build..."
        ls -la source/grapa-lib/linux-amd64/ || echo "No grapa libraries found"
        echo "Building wheel..."
        python setup.py bdist_wheel
        echo "Setup.py exit code: $?"
        if [ $? -ne 0 ]; then
          echo "ERROR: setup.py failed with exit code $?"
          exit 1
        fi
        echo "Wheel build completed. Checking for wheel files..."
        ls -la dist/ || echo "No wheel files found"
        echo "Checking if setup.py created any files..."
        ls -la build/ 2>/dev/null || echo "No build directory found"
        ls -la *.egg-info/ 2>/dev/null || echo "No egg-info directory found"
    
    - name: Upload wheels
      uses: actions/upload-artifact@v4
      with:
        name: wheels-${{ matrix.os }}-py${{ matrix.python-version }}
        path: dist/*.whl

  upload-to-pypi:
    needs: build-wheels
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      id-token: write
    
    steps:
    - name: Download all wheels
      uses: actions/download-artifact@v4
      with:
        path: dist/
    
    - name: Upload to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }} 