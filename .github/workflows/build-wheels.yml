name: Build Wheels

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build-wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install build dependencies (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libx11-dev libxfixes-dev libxft-dev libxext-dev libxrender-dev libxinerama-dev libxcursor-dev libxau-dev libpng-dev libfontconfig1-dev libfreetype6-dev
        pip install wheel setuptools build
    
    - name: Install build dependencies (Windows/Mac)
      if: matrix.os != 'ubuntu-latest'
      run: |
        pip install wheel setuptools build
    
    - name: Build core libraries (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        Write-Host "Building core libraries first..."
        Write-Host "Current directory: $(Get-Location)"
        Write-Host "Checking if required library directories exist..."
        Get-ChildItem source/openssl-lib/win-amd64/ -ErrorAction SilentlyContinue | Write-Host
        Get-ChildItem source/fl-lib/win-amd64/ -ErrorAction SilentlyContinue | Write-Host
        Get-ChildItem source/blst-lib/win-amd64/ -ErrorAction SilentlyContinue | Write-Host
        Get-ChildItem source/pcre2-lib/win-amd64/ -ErrorAction SilentlyContinue | Write-Host
        Write-Host "Running build.py --lib-only..."
        python build.py --lib-only
        $exitCode = $LASTEXITCODE
        Write-Host "Build.py exit code: $exitCode"
        if ($exitCode -ne 0) {
          Write-Host "ERROR: build.py failed with exit code $exitCode"
          exit 1
        }
        Write-Host "Library build completed. Checking for library files..."
        Get-ChildItem source/grapa-lib/win-amd64/ -ErrorAction SilentlyContinue | Write-Host
        Write-Host "Checking if build.py created any files in current directory..."
        Get-ChildItem *.o, *.a, *.so -ErrorAction SilentlyContinue | Write-Host
    
    - name: Build core libraries (Linux/Mac)
      if: matrix.os != 'windows-latest'
      shell: bash
      run: |
        echo "Building core libraries first..."
        echo "Current directory: $(pwd)"
        echo "Checking if required library directories exist..."
        ls -la source/openssl-lib/linux-amd64/ || echo "OpenSSL libs not found"
        ls -la source/fl-lib/linux-amd64/ || echo "FL libs not found"
        ls -la source/blst-lib/linux-amd64/ || echo "BLST libs not found"
        ls -la source/pcre2-lib/linux-amd64/ || echo "PCRE2 libs not found"
        echo "Running build.py --lib-only..."
        python build.py --lib-only
        echo "Build.py exit code: $?"
        if [ $? -ne 0 ]; then
          echo "ERROR: build.py failed with exit code $?"
          exit 1
        fi
        echo "Library build completed. Checking for library files..."
        ls -la source/grapa-lib/linux-amd64/ || echo "No library files found"
        echo "Checking if build.py created any files in current directory..."
        ls -la *.o *.a *.so 2>/dev/null || echo "No build artifacts found in current directory"
    
    - name: Build wheels (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        Write-Host "Current directory: $(Get-Location)"
        Write-Host "Python version: $(python --version)"
        Write-Host "Checking if libraries exist before wheel build..."
        Get-ChildItem source/grapa-lib/win-amd64/ -ErrorAction SilentlyContinue | Write-Host
        Write-Host "Building wheel..."
        python setup.py bdist_wheel
        $exitCode = $LASTEXITCODE
        Write-Host "Setup.py exit code: $exitCode"
        if ($exitCode -ne 0) {
          Write-Host "ERROR: setup.py failed with exit code $exitCode"
          exit 1
        }
        Write-Host "Wheel build completed. Checking for wheel files..."
        Get-ChildItem dist/ -ErrorAction SilentlyContinue | Write-Host
        Write-Host "Checking if setup.py created any files..."
        Get-ChildItem build/ -ErrorAction SilentlyContinue | Write-Host
        Get-ChildItem *.egg-info/ -ErrorAction SilentlyContinue | Write-Host
        Write-Host "Listing all files in dist directory:"
        Get-ChildItem dist/ -Recurse -ErrorAction SilentlyContinue | Write-Host
    
    - name: Build wheels (Linux/Mac)
      if: matrix.os != 'windows-latest'
      shell: bash
      run: |
        echo "Current directory: $(pwd)"
        echo "Python version: $(python --version)"
        echo "Checking if libraries exist before wheel build..."
        ls -la source/grapa-lib/linux-amd64/ || echo "No grapa libraries found"
        echo "Building wheel..."
        python setup.py bdist_wheel
        echo "Setup.py exit code: $?"
        if [ $? -ne 0 ]; then
          echo "ERROR: setup.py failed with exit code $?"
          exit 1
        fi
        echo "Wheel build completed. Checking for wheel files..."
        ls -la dist/ || echo "No wheel files found"
        echo "Checking if setup.py created any files..."
        ls -la build/ 2>/dev/null || echo "No build directory found"
        ls -la *.egg-info/ 2>/dev/null || echo "No egg-info directory found"
        echo "Listing all files in dist directory:"
        ls -la dist/ -R || echo "No files found"
        
        # For Linux, we'll manually rename the wheel to use manylinux2014 platform tag
        if [ "$RUNNER_OS" = "Linux" ]; then
          echo "Renaming Linux wheels to use manylinux2014 platform tag..."
          for wheel in dist/*.whl; do
            if [ -f "$wheel" ]; then
              echo "Processing $wheel"
              # Extract the wheel name and version
              wheel_name=$(basename "$wheel")
              # Replace linux_x86_64 with manylinux2014_x86_64
              new_name=$(echo "$wheel_name" | sed 's/linux_x86_64/manylinux2014_x86_64/g')
              if [ "$wheel_name" != "$new_name" ]; then
                mv "$wheel" "dist/$new_name"
                echo "Renamed $wheel_name to $new_name"
              fi
            fi
          done
          echo "Wheels after renaming:"
          ls -la dist/
        fi
    
    - name: Upload wheels
      uses: actions/upload-artifact@v4
      with:
        name: wheels-${{ matrix.os }}-py${{ matrix.python-version }}
        path: dist/*.whl

  upload-to-pypi:
    needs: build-wheels
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      id-token: write
    
    steps:
    - name: Download all wheels
      uses: actions/download-artifact@v4
      with:
        path: dist/
        merge-multiple: true
    
    - name: Ensure dist directory exists
      run: |
        mkdir -p dist/
    
    - name: Debug downloaded artifacts
      run: |
        echo "Checking what was downloaded:"
        ls -la dist/
        echo "Listing all files recursively:"
        find dist/ -type f 2>/dev/null || echo "No files found"
    
    - name: Upload to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }} 