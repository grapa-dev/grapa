name: Build Wheels

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build-wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest]
        python-version: ['3.11']

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install build dependencies
      run: |
        pip install wheel setuptools build
    
    - name: Build core libraries
      shell: pwsh
      run: |
        Write-Host "Building core libraries first..."
        Write-Host "Current directory: $(Get-Location)"
        Write-Host "Checking if required library directories exist..."
        Get-ChildItem source/openssl-lib/win-amd64/ -ErrorAction SilentlyContinue | Write-Host
        Get-ChildItem source/fl-lib/win-amd64/ -ErrorAction SilentlyContinue | Write-Host
        Get-ChildItem source/blst-lib/win-amd64/ -ErrorAction SilentlyContinue | Write-Host
        Get-ChildItem source/pcre2-lib/win-amd64/ -ErrorAction SilentlyContinue | Write-Host
        Write-Host "Running build.py --lib-only..."
        python build.py --lib-only
        $exitCode = $LASTEXITCODE
        Write-Host "Build.py exit code: $exitCode"
        if ($exitCode -ne 0) {
          Write-Host "ERROR: build.py failed with exit code $exitCode"
          exit 1
        }
        Write-Host "Library build completed. Checking for library files..."
        Get-ChildItem source/grapa-lib/win-amd64/ -ErrorAction SilentlyContinue | Write-Host
        Write-Host "Checking if build.py created any files in current directory..."
        Get-ChildItem *.o, *.a, *.so -ErrorAction SilentlyContinue | Write-Host
    
    - name: Build wheels
      shell: pwsh
      run: |
        Write-Host "Current directory: $(Get-Location)"
        Write-Host "Python version: $(python --version)"
        Write-Host "Checking if libraries exist before wheel build..."
        Get-ChildItem source/grapa-lib/win-amd64/ -ErrorAction SilentlyContinue | Write-Host
        Write-Host "Building wheel..."
        python setup.py bdist_wheel
        $exitCode = $LASTEXITCODE
        Write-Host "Setup.py exit code: $exitCode"
        if ($exitCode -ne 0) {
          Write-Host "ERROR: setup.py failed with exit code $exitCode"
          exit 1
        }
        Write-Host "Wheel build completed. Checking for wheel files..."
        Get-ChildItem dist/ -ErrorAction SilentlyContinue | Write-Host
        Write-Host "Checking if setup.py created any files..."
        Get-ChildItem build/ -ErrorAction SilentlyContinue | Write-Host
        Get-ChildItem *.egg-info/ -ErrorAction SilentlyContinue | Write-Host
        Write-Host "Listing all files in dist directory:"
        Get-ChildItem dist/ -Recurse -ErrorAction SilentlyContinue | Write-Host
    
    - name: Upload wheels
      uses: actions/upload-artifact@v4
      with:
        name: wheels-${{ matrix.os }}-py${{ matrix.python-version }}
        path: dist/

  upload-to-pypi:
    needs: build-wheels
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      id-token: write
    
    steps:
    - name: Download all wheels
      uses: actions/download-artifact@v4
      with:
        path: dist/
    
    - name: Debug downloaded artifacts
      run: |
        echo "Checking what was downloaded:"
        ls -la dist/
        echo "Listing all files recursively:"
        find dist/ -type f 2>/dev/null || echo "No files found"
    
    - name: Upload to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }} 