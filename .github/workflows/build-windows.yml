name: Build Windows AMD64

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install Visual Studio Build Tools
      uses: microsoft/setup-msbuild@v1.1
      
    - name: Create output directories
      run: |
        New-Item -ItemType Directory -Force -Path "source/grapa-lib/win-amd64"
        New-Item -ItemType Directory -Force -Path "source/grapa-other/win-amd64"
        New-Item -ItemType Directory -Force -Path "bin"
        
    - name: Build Grapa for Windows AMD64
      run: |
        echo "🚀 Building Grapa for Windows AMD64..."
        echo "📋 Python version:"
        python --version
        echo "📋 Available build.py options:"
        python build.py --help
        echo "📋 Checking if Windows project files exist:"
        Get-ChildItem prj/win-amd64/ -ErrorAction SilentlyContinue
        echo "📋 Checking if x64/Release directory exists:"
        Get-ChildItem prj/win-amd64/x64/ -ErrorAction SilentlyContinue
        echo "📋 Running build with --bin-only:"
        python build.py --bin-only
        echo "📋 Checking if grapa.exe was created in root:"
        Get-ChildItem grapa.exe -ErrorAction SilentlyContinue
        echo "📋 Checking if grapa.exe was created in build directory:"
        Get-ChildItem prj/win-amd64/x64/Release/grapa.exe -ErrorAction SilentlyContinue
        echo "✅ Build completed successfully!"
        
    - name: List build artifacts
      run: |
        echo "Build artifacts:"
        echo "📁 Current directory contents:"
        Get-ChildItem -ErrorAction SilentlyContinue
        echo "📁 Checking for grapa.exe:"
        Get-ChildItem grapa.exe -ErrorAction SilentlyContinue
        echo "📁 Checking for grapa.lib:"
        Get-ChildItem grapa.lib -ErrorAction SilentlyContinue
        echo "📁 Checking source/grapa-lib/win-amd64/:"
        Get-ChildItem source/grapa-lib/win-amd64/ -ErrorAction SilentlyContinue
        echo "📁 Checking source/grapa-other/win-amd64/:"
        Get-ChildItem source/grapa-other/win-amd64/ -ErrorAction SilentlyContinue
        echo "📁 Checking bin/grapa-win-amd64.zip:"
        Get-ChildItem bin/grapa-win-amd64.zip -ErrorAction SilentlyContinue
        
    - name: Test Windows CLI
      run: |
        echo "🧪 Testing Windows CLI functionality..."
        
        # Check if grapa.exe already exists in root
        if (Test-Path "grapa.exe") {
            echo "✅ grapa.exe found in root directory"
        } else {
            echo "📁 grapa.exe not found in root, checking zip file..."
            
            # Check if zip file exists
            if (Test-Path "bin/grapa-win-amd64.zip") {
                echo "📁 Found bin/grapa-win-amd64.zip, extracting..."
                
                # List contents of zip file
                echo "📋 Contents of zip file:"
                try {
                    $zipContents = Get-ChildItem -Path "bin/grapa-win-amd64.zip" | ForEach-Object { $_.Name }
                    echo "Zip file size: $((Get-Item 'bin/grapa-win-amd64.zip').Length) bytes"
                    
                    # Extract the zip file
                    Expand-Archive -Path "bin/grapa-win-amd64.zip" -DestinationPath "." -Force
                    echo "✅ Extraction completed"
                    
                    # List what was extracted
                    echo "📋 Files in current directory after extraction:"
                    Get-ChildItem -ErrorAction SilentlyContinue | ForEach-Object { echo "  - $($_.Name)" }
                    
                } catch {
                    echo "❌ Error during extraction: $_"
                    exit 1
                }
            } else {
                echo "❌ bin/grapa-win-amd64.zip not found"
                echo "📋 Checking what's in bin/ directory:"
                if (Test-Path "bin") {
                    Get-ChildItem "bin" -ErrorAction SilentlyContinue | ForEach-Object { echo "  - $($_.Name)" }
                } else {
                    echo "  bin/ directory does not exist"
                }
                exit 1
            }
        }
        
        # Check if grapa.exe exists after extraction
        if (Test-Path "grapa.exe") {
            echo "✅ grapa.exe found"
            
            # Test help command
            echo "📋 Testing help command..."
            $helpOutput = .\grapa.exe -h 2>&1
            echo "Help output: $helpOutput"
            
            # Test version command
            echo "📋 Testing version command..."
            $versionOutput = .\grapa.exe -c "`$sys().getenv(`$VERSION);" 2>&1
            echo "Version output: $versionOutput"
            
            # Test basic functionality
            echo "📋 Testing basic functionality..."
            $basicOutput = .\grapa.exe -c "2 + 2;" 2>&1
            echo "Basic test output: $basicOutput"
            
            # Test file operations
            echo "📋 Testing file operations..."
            $fileOutput = .\grapa.exe -c "`$global.fs = `$file(); fs.set('test.txt', 'Hello Windows!'); fs.get('test.txt');" 2>&1
            echo "File test output: $fileOutput"
            
            echo "✅ Windows CLI testing completed successfully!"
        } else {
            echo "❌ grapa.exe not found after extraction - build may have failed"
            echo "📋 Current directory contents:"
            Get-ChildItem -ErrorAction SilentlyContinue | ForEach-Object { echo "  - $($_.Name)" }
            exit 1
        }
        
    - name: Test Python package
      run: |
        echo "🧪 Testing Python package on Windows..."
        
        # Build Python package
        echo "📋 Building Python package..."
        python build.py --python-only
        
        # Check what was built
        echo "📋 Checking dist/ directory contents:"
        if (Test-Path "dist") {
            Get-ChildItem "dist" -ErrorAction SilentlyContinue | ForEach-Object { echo "  - $($_.Name)" }
        } else {
            echo "  dist/ directory does not exist"
        }
        
        # Install the package (try different formats)
        echo "📋 Installing Python package..."
        $packageInstalled = $false
        
        # Try wheel files first
        $wheelFiles = Get-ChildItem "dist" -Filter "*.whl" -ErrorAction SilentlyContinue
        if ($wheelFiles) {
            echo "📋 Found wheel files:"
            $wheelFiles | ForEach-Object { echo "  - $($_.Name)" }
            try {
                pip install $wheelFiles[0].FullName --force-reinstall
                $packageInstalled = $true
                echo "✅ Successfully installed wheel package"
            } catch {
                echo "❌ Failed to install wheel package: $_"
            }
        }
        
        # Try source distribution if wheel failed
        if (-not $packageInstalled) {
            $tarFiles = Get-ChildItem "dist" -Filter "*.tar.gz" -ErrorAction SilentlyContinue
            if ($tarFiles) {
                echo "📋 Found source distribution:"
                $tarFiles | ForEach-Object { echo "  - $($_.Name)" }
                try {
                    pip install $tarFiles[0].FullName --force-reinstall
                    $packageInstalled = $true
                    echo "✅ Successfully installed source package"
                } catch {
                    echo "❌ Failed to install source package: $_"
                }
            }
        }
        
        if (-not $packageInstalled) {
            echo "❌ No package files found to install"
            exit 1
        }
        
        # Test Python functionality (avoid Unicode characters)
        echo "📋 Testing Python functionality..."
        python -c "import grapapy; xy = grapapy.grapa(); result = xy.eval('2 + 2;'); print(f'GrapaPy test: 2 + 2 = {result}'); assert result == 4, 'Basic functionality test failed'; print('SUCCESS: Python package test passed!')"
        
        echo "✅ Python package testing completed successfully!"
        
    - name: Upload Windows build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: grapa-windows-amd64
        path: |
          grapa.exe
          grapa.lib
          source/grapa-lib/win-amd64/
          source/grapa-other/win-amd64/
          bin/grapa-win-amd64.zip
        retention-days: 30 