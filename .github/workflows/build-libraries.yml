name: Build Libraries and Binaries (Fixed)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-libraries:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Windows AMD64
          - os: windows-latest
            platform: win-amd64
            arch: x64
          # macOS AMD64
          - os: macos-latest
            platform: mac-amd64
            arch: amd64
          # macOS ARM64
          - os: macos-latest
            platform: mac-arm64
            arch: arm64
          # Linux AMD64
          - os: ubuntu-latest
            platform: linux-amd64
            arch: amd64
          # Linux ARM64
          - os: ubuntu-latest
            platform: linux-arm64
            arch: arm64

    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        ref: main
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install build dependencies (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        Write-Host "Installing build dependencies for Windows..."
        # Visual Studio is pre-installed on windows-latest
        Write-Host "Visual Studio environment available"
        
    - name: Install build dependencies (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        echo "Installing build dependencies for Linux..."
        sudo apt-get update
        sudo apt-get install -y libx11-dev libxfixes-dev libxft-dev libxext-dev libxrender-dev libxinerama-dev libxcursor-dev libxau-dev libpng-dev libfontconfig1-dev libfreetype6-dev libxcb1-dev
        
    - name: Install build dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        echo "Installing build dependencies for macOS..."
        # Xcode command line tools are pre-installed on macos-latest
        
    - name: Build libraries and binaries (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        Write-Host "Building libraries for platform: ${{ matrix.platform }}"
        Write-Host "Current directory: $(Get-Location)"
        Write-Host "Platform: ${{ matrix.platform }}"
        
        # Build libraries only
        python build.py --lib-only --platform windows --arch amd64
        
        Write-Host "Build completed. Checking for libraries..."
        Get-ChildItem "source/grapa-lib/${{ matrix.platform }}/" -ErrorAction SilentlyContinue | Write-Host
        Get-ChildItem "source/openssl-lib/${{ matrix.platform }}/" -ErrorAction SilentlyContinue | Write-Host
        Get-ChildItem "source/fl-lib/${{ matrix.platform }}/" -ErrorAction SilentlyContinue | Write-Host
        Get-ChildItem "source/blst-lib/${{ matrix.platform }}/" -ErrorAction SilentlyContinue | Write-Host
        Get-ChildItem "source/pcre2-lib/${{ matrix.platform }}/" -ErrorAction SilentlyContinue | Write-Host
        
    - name: Build libraries and binaries (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        echo "Building libraries for platform: ${{ matrix.platform }}"
        echo "Current directory: $(pwd)"
        echo "Platform: ${{ matrix.platform }}"
        
        # Build libraries only
        python build.py --lib-only --platform mac --arch ${{ matrix.arch }}
        
        echo "Build completed. Checking for libraries..."
        ls -la source/grapa-lib/${{ matrix.platform }}/ || echo "No grapa libraries found"
        ls -la source/openssl-lib/${{ matrix.platform }}/ || echo "No OpenSSL libraries found"
        ls -la source/fl-lib/${{ matrix.platform }}/ || echo "No FL libraries found"
        ls -la source/blst-lib/${{ matrix.platform }}/ || echo "No BLST libraries found"
        ls -la source/pcre2-lib/${{ matrix.platform }}/ || echo "No PCRE2 libraries found"
        
    - name: Build libraries and binaries (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        echo "Building libraries for platform: ${{ matrix.platform }}"
        echo "Current directory: $(pwd)"
        echo "Platform: ${{ matrix.platform }}"
        
        # Build libraries only
        python build.py --lib-only --platform linux --arch ${{ matrix.arch }}
        
        echo "Build completed. Checking for libraries..."
        ls -la source/grapa-lib/${{ matrix.platform }}/ || echo "No grapa libraries found"
        ls -la source/openssl-lib/${{ matrix.platform }}/ || echo "No OpenSSL libraries found"
        ls -la source/fl-lib/${{ matrix.platform }}/ || echo "No FL libraries found"
        ls -la source/blst-lib/${{ matrix.platform }}/ || echo "No BLST libraries found"
        ls -la source/pcre2-lib/${{ matrix.platform }}/ || echo "No PCRE2 libraries found"
        
    - name: Create archives (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        Write-Host "Creating Windows archive for ${{ matrix.platform }}..."
        
        # Get files to include (matching build.py logic)
        $filesToInclude = @()
        
        # Add executable if it exists
        if (Test-Path "grapa.exe") {
          $filesToInclude += "grapa.exe"
        }
        
        # Add library file if it exists
        if (Test-Path "grapa.lib") {
          $filesToInclude += "grapa.lib"
        }
        
        if ($filesToInclude.Count -gt 0) {
          Compress-Archive -Path $filesToInclude -DestinationPath "bin/grapa-${{ matrix.platform }}.zip" -Force
          Write-Host "Created bin/grapa-${{ matrix.platform }}.zip with files: $($filesToInclude -join ', ')"
        } else {
          Write-Host "No files found to include in archive, skipping archive creation"
        }
        
    - name: Create archives (Linux/macOS)
      if: matrix.os != 'windows-latest'
      run: |
        echo "Creating archive for ${{ matrix.platform }}..."
        
        # Get files to include (matching build.py logic)
        files_to_include=()
        
        # Add executable if it exists
        if [ -f "grapa" ]; then
          files_to_include+=("grapa")
        fi
        
        # Add library files
        if [ -d "source/grapa-lib/${{ matrix.platform }}/" ]; then
          files_to_include+=("source/grapa-lib/${{ matrix.platform }}/"*)
        fi
        
        # Add other files (for Mac shared libraries)
        if [ -d "source/grapa-other/${{ matrix.platform }}/" ]; then
          files_to_include+=("source/grapa-other/${{ matrix.platform }}/"*)
        fi
        
        if [ ${#files_to_include[@]} -gt 0 ]; then
          tar -czf "bin/grapa-${{ matrix.platform }}.tar.gz" "${files_to_include[@]}"
          echo "Created bin/grapa-${{ matrix.platform }}.tar.gz with files: ${files_to_include[*]}"
        else
          echo "No files found to include in archive, skipping archive creation"
        fi
        
    # Upload artifacts for later commit
    - name: Upload platform artifacts
      uses: actions/upload-artifact@v4
      with:
        name: platform-artifacts-${{ matrix.platform }}
        path: |
          source/grapa-lib/${{ matrix.platform }}/
          source/openssl-lib/${{ matrix.platform }}/
          source/fl-lib/${{ matrix.platform }}/
          source/blst-lib/${{ matrix.platform }}/
          source/pcre2-lib/${{ matrix.platform }}/
          source/grapa-other/${{ matrix.platform }}/
          bin/
          grapa*
          libgrapa.*
        
    - name: Upload artifacts (for backup)
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts-${{ matrix.platform }}
        path: |
          source/*-lib/${{ matrix.platform }}/
          source/grapa-other/${{ matrix.platform }}/
          bin/
          grapa*
          libgrapa.*
          
  commit-all-artifacts:
    needs: build-libraries
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        ref: main
    
    - name: Download all platform artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts/
        merge-multiple: true
    
    - name: Extract and commit artifacts
      run: |
        echo "Extracting and committing all platform artifacts..."
        
        # Setup Git
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # Debug: List what's in artifacts directory
        echo "=== DEBUG: Artifacts directory contents ==="
        ls -la artifacts/ || echo "artifacts/ directory not found"
        find artifacts/ -type f 2>/dev/null | head -20 || echo "No files found in artifacts/"
        
        # Extract artifacts to their correct locations
        echo "=== DEBUG: Processing artifacts ==="
        
                 # Copy all artifacts directly (they're already in the right structure)
         echo "Copying all artifacts to current directory..."
         cp -rv artifacts/* . 2>&1 || echo "Failed to copy artifacts"
         
         # Remove the wrong Windows archive if it exists
         if [ -f "bin/grapa-win-win-amd64.zip" ]; then
           echo "Removing incorrect Windows archive: bin/grapa-win-win-amd64.zip"
           rm "bin/grapa-win-win-amd64.zip"
         fi
         
         # Remove test files that shouldn't be committed
         if [ -f "grapapy_test.ipynb" ]; then
           echo "Removing test file: grapapy_test.ipynb"
           rm "grapapy_test.ipynb"
         fi
        
        # Debug: Check what files we have after extraction
        echo "=== DEBUG: Files after extraction ==="
        ls -la source/grapa-lib/ 2>/dev/null || echo "No grapa-lib directory"
        ls -la source/openssl-lib/ 2>/dev/null || echo "No openssl-lib directory"
        ls -la source/fl-lib/ 2>/dev/null || echo "No fl-lib directory"
        ls -la source/blst-lib/ 2>/dev/null || echo "No blst-lib directory"
        ls -la source/pcre2-lib/ 2>/dev/null || echo "No pcre2-lib directory"
        ls -la source/grapa-other/ 2>/dev/null || echo "No grapa-other directory"
        ls -la bin/ 2>/dev/null || echo "No bin directory"
        ls -la grapa* 2>/dev/null || echo "No grapa executables"
        ls -la libgrapa.* 2>/dev/null || echo "No libgrapa files"
        
                 # Add all platform-specific libraries (force add to ensure all files are included)
         echo "=== DEBUG: Adding files to git ==="
         git add -A source/grapa-lib/ 2>&1 || echo "No grapa-lib changes"
         git add -A source/openssl-lib/ 2>&1 || echo "No openssl-lib changes"
         git add -A source/fl-lib/ 2>&1 || echo "No fl-lib changes"
         git add -A source/blst-lib/ 2>&1 || echo "No blst-lib changes"
         git add -A source/pcre2-lib/ 2>&1 || echo "No pcre2-lib changes"
         git add -A source/grapa-other/ 2>&1 || echo "No grapa-other changes"
         
         # Add top-level binary artifacts (only if they exist and are not test files)
         if [ -f "grapa" ] || [ -f "grapa.exe" ]; then
           git add grapa* 2>&1 || echo "No grapa executable changes"
         fi
         
         # Add binaries
         git add -A bin/ 2>&1 || echo "No bin changes"
        
        # Debug: Check git status
        echo "=== DEBUG: Git status ==="
        git status --porcelain
        
        # Commit and push
        git commit -m "Update pre-built libraries and binaries for all platforms [automated]" || echo "No changes to commit"
        git push origin main
        
  build-wheels-linux:
    needs: commit-all-artifacts
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - uses: actions/checkout@v4
      with:
        ref: main
    
    - name: Install build dependencies for wheel building
      run: |
        echo "Installing build dependencies for wheel building..."
        # Install system dependencies
        sudo apt-get update
        sudo apt-get install -y libx11-dev libxfixes-dev libxft-dev libxext-dev libxrender-dev libxinerama-dev libxcursor-dev libxau-dev libpng-dev libfontconfig1-dev libfreetype6-dev libxcb1-dev
        # Install Python dependencies
        python -m pip install --upgrade pip setuptools wheel build
        
    - name: Build Linux wheel
      run: |
        echo "Building Linux wheel using Extension approach..."
        
        # Clean previous builds to ensure fresh wheels
        rm -rf dist/ build/ *.egg-info/
        
        # Build wheel and source distribution for Linux (Extension approach)
        echo "Building wheel and source distribution for Linux..."
        python setup.py bdist_wheel --plat-name manylinux2014_x86_64
        python setup.py sdist
        
        echo "Built distributions:"
        ls -la dist/
        
    - name: Upload Linux distributions artifact
      uses: actions/upload-artifact@v4
      with:
        name: dists-linux
        path: dist/

  build-wheels-windows:
    needs: commit-all-artifacts
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - uses: actions/checkout@v4
      with:
        ref: main
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install build dependencies for wheel building
      run: |
        echo "Installing build dependencies for wheel building..."
        # Install Python dependencies
        python -m pip install --upgrade pip setuptools wheel build
        
    - name: Build Windows wheel
      run: |
        echo "Building Windows wheel using Extension approach..."
        
        # Clean previous builds to ensure fresh wheels
        Remove-Item -Recurse -Force dist, build, *.egg-info -ErrorAction SilentlyContinue
        
        # Build wheel and source distribution for Windows (Extension approach)
        echo "Building wheel and source distribution for Windows..."
        python setup.py bdist_wheel --plat-name win_amd64
        python setup.py sdist
        
        echo "Built distributions:"
        Get-ChildItem dist/
        
    - name: Upload Windows distributions artifact
      uses: actions/upload-artifact@v4
      with:
        name: dists-windows
        path: dist/

  build-wheels-macos:
    needs: commit-all-artifacts
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - uses: actions/checkout@v4
      with:
        ref: main
    
    - name: Install build dependencies for wheel building
      run: |
        echo "Installing build dependencies for wheel building..."
        # Install Python dependencies
        python -m pip install --upgrade pip setuptools wheel build
        
    - name: Build macOS wheel
      run: |
        echo "Building macOS wheel using CMakeExtension approach..."
        
        # Clean previous builds to ensure fresh wheels
        rm -rf dist/ build/ *.egg-info/
        
        # Build wheel and source distribution for macOS (CMakeExtension approach)
        echo "Building wheel and source distribution for macOS..."
        python setup.py bdist_wheel --plat-name macosx_10_9_x86_64
        python setup.py sdist
        
        echo "Built distributions:"
        ls -la dist/
        
    - name: Upload macOS distributions artifact
      uses: actions/upload-artifact@v4
      with:
        name: dists-macos
        path: dist/

  combine-distributions:
    needs: [build-wheels-linux, build-wheels-windows, build-wheels-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Download all distribution artifacts
      uses: actions/download-artifact@v4
      with:
        path: dists/
        merge-multiple: true
        
    - name: Clean and organize distributions
      run: |
        echo "Cleaning distribution artifacts..."
        
        # Remove any non-distribution files/directories
        find dists/ -name "bin" -type d -exec rm -rf {} + 2>/dev/null || true
        find dists/ -name "source" -type d -exec rm -rf {} + 2>/dev/null || true
        find dists/ -name "grapa*" -type f -not -name "*.whl" -not -name "*.tar.gz" -not -name "*.zip" -delete 2>/dev/null || true
        find dists/ -name "libgrapa*" -type f -delete 2>/dev/null || true
        
        # Keep only actual distribution files
        echo "Distribution files to upload:"
        find dists/ -name "*.whl" -o -name "*.tar.gz" -o -name "*.zip" | sort
        
    - name: Upload combined distributions artifact
      uses: actions/upload-artifact@v4
      with:
        name: all-distributions
        path: dists/

  deploy-to-pypi:
    needs: combine-distributions
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Download combined distributions
      uses: actions/download-artifact@v4
      with:
        name: all-distributions
        path: dists/
        
    - name: Upload to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
        packages-dir: dists/ 