docs_dir: docs
site_dir: site

site_name: Grapa Documentation
site_url: https://grapa-dev.github.io/grapa/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.top
    - search.suggest
    # - search.highlight  # TEMPORARILY DISABLED - Testing search corruption fix
    - content.code.copy
    - content.action.edit
    - content.action.view
    - content.tabs.link
  search:
    exclude:
      - maintainers/**
      - "maintainers/**"
      - "**/maintainers/**"
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  font:
    text: Roboto
    code: Roboto Mono
  language: en

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: "!!python/name:pymdownx.superfences.fence_code_format"
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search:
      lang: en
      separator: \s\-,:!=\[\]()"/`|]+'
  - exclude-search:
      exclude:
        - "maintainers/**"
        - "maintainers/index.md"
        - "maintainers/BINARY_GREP.md"
        - "maintainers/README.md"
        - "maintainers/ADVANCED_TOPICS/**"
        - "maintainers/INTERNAL_NOTES/**"
        - "maintainers/DEVELOPMENT/**"
        - "maintainers/TESTING_AND_QUALITY/**"
        - "maintainers/IMPLEMENTATION/**"
        - "maintainers/BUILD_AND_DEPLOYMENT/**"
        - "maintainers/WIP/**"
        - "**/maintainers/**"
        - "**/BUILD_AND_DEPLOYMENT/**"
        - "**/IMPLEMENTATION/**"
        - "**/TESTING_AND_QUALITY/**"
        - "**/DEVELOPMENT/**"
        - "**/INTERNAL_NOTES/**"
        - "**/ADVANCED_TOPICS/**"
  - tags

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@10.9.0/dist/mermaid.min.js
  - javascripts/mermaid-init.js
  - javascripts/search-fix.js

